<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 170" width="400" height="170" role="img" aria-label="Animation of a boy kicking a football" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>

  <style>
    .limb   { fill: none; stroke: #22c55e; stroke-width: 5; stroke-linecap: round; }
    .head   { fill: #22c55e; }
    .hair   { fill: none; stroke: #22c55e; stroke-width: 4; stroke-linecap: round; }
    .ground { stroke: #94a3b8; stroke-width: 2; stroke-linecap: round; opacity: .45; }
    .grass  { stroke: #22c55e; stroke-width: 2.5; stroke-linecap: round; opacity: .55; fill: none; }
    .shadow { fill: #94a3b8; opacity: .22; }
    .skin   { fill: #ffffff; stroke: #0f172a; stroke-width: 2.5; }
    .mark   { fill: #0f172a; }
    .puff   { fill: none; stroke: #94a3b8; stroke-width: 2.5; opacity: 0; }

    #body     { animation: lean   3s ease-in-out infinite; transform-origin: 120px 132px; }
    #kickleg  { animation: swing  3s ease-in-out infinite; transform-origin: 120px 100px; }
    #standleg { animation: plant  3s ease-in-out infinite; transform-origin: 120px 100px; }
    #armback  { animation: armb   3s ease-in-out infinite; transform-origin: 120px 80px; }
    #armfront { animation: armf   3s ease-in-out infinite; transform-origin: 120px 80px; }
    #puff     { animation: poof   3s linear      infinite; transform-origin: 150px 130px; }
    #ball     { animation: fly    3s linear      infinite; transform-origin: 160px 122px; }

    /* the kicking leg: wind back, strike, follow through */
    @keyframes swing {
      0%,  8%  { transform: rotate(0deg); }
      18%      { transform: rotate(34deg); }
      26%      { transform: rotate(-52deg); }
      34%      { transform: rotate(-22deg); }
      48%,100% { transform: rotate(0deg); }
    }

    /* planted leg takes the weight */
    @keyframes plant {
      0%,  8%  { transform: rotate(0deg); }
      18%      { transform: rotate(-6deg); }
      26%      { transform: rotate(9deg); }
      48%,100% { transform: rotate(0deg); }
    }

    /* whole body leans into the strike, then settles */
    @keyframes lean {
      0%,  8%  { transform: rotate(0deg); }
      18%      { transform: rotate(4deg); }
      26%      { transform: rotate(-7deg); }
      36%      { transform: rotate(-2deg); }
      48%,100% { transform: rotate(0deg); }
    }

    /* arms counterbalance */
    @keyframes armb {
      0%,  8%  { transform: rotate(0deg); }
      18%      { transform: rotate(-22deg); }
      26%      { transform: rotate(30deg); }
      48%,100% { transform: rotate(0deg); }
    }
    @keyframes armf {
      0%,  8%  { transform: rotate(0deg); }
      18%      { transform: rotate(24deg); }
      26%      { transform: rotate(-34deg); }
      48%,100% { transform: rotate(0deg); }
    }

    /* little dust puff on contact */
    @keyframes poof {
      0%, 25%  { opacity: 0; transform: scale(.3); }
      28%      { opacity: .7; transform: scale(1); }
      38%      { opacity: 0; transform: scale(1.7); }
      100%     { opacity: 0; transform: scale(.3); }
    }

    /* ball: struck, arcs away, bounces, resets off-frame */
    @keyframes fly {
      0%,  26% { transform: translate(0px, 0px) rotate(0deg); opacity: 1; }
      38%      { transform: translate(62px, -40px) rotate(200deg); opacity: 1; }
      50%      { transform: translate(124px, -46px) rotate(400deg); opacity: 1; }
      62%      { transform: translate(180px, 0px) rotate(580deg); opacity: 1; }
      67%      { transform: translate(198px, -16px) rotate(650deg); opacity: 1; }
      73%      { transform: translate(216px, 0px) rotate(720deg); opacity: 1; }
      80%      { transform: translate(232px, 0px) rotate(780deg); opacity: 0; }
      81%      { transform: translate(0px, 0px) rotate(0deg); opacity: 0; }
      92%,100% { transform: translate(0px, 0px) rotate(0deg); opacity: 1; }
    }

    /* respect reduced-motion preferences */
    @media (prefers-reduced-motion: reduce) {
      #body, #kickleg, #standleg, #armback, #armfront, #puff, #ball { animation: none; }
    }
  </style>

  <!-- pitch -->
  <line class="ground" x1="15" y1="133" x2="385" y2="133" />
  <g class="grass">
    <path d="M40 133 l-4 -8 M46 133 l0 -10 M52 133 l4 -8" />
    <path d="M300 133 l-4 -8 M306 133 l0 -10 M312 133 l4 -8" />
    <path d="M355 133 l-3 -7 M360 133 l0 -9" />
  </g>

  <ellipse class="shadow" cx="120" cy="135" rx="24" ry="4" />

  <!-- dust puff at the point of contact -->
  <g id="puff">
    <path class="puff" d="M142 130 q6 -7 14 -3" />
    <path class="puff" d="M140 124 q7 -8 16 -4" />
  </g>

  <!-- the boy -->
  <g id="body">
    <g id="armback">
      <path class="limb" d="M120 80 L104 95" />
    </g>

    <g id="standleg">
      <path class="limb" d="M120 100 L112 132" />
    </g>

    <g id="kickleg">
      <path class="limb" d="M120 100 L139 129" />
    </g>

    <!-- torso -->
    <path class="limb" d="M120 78 L120 100" />

    <!-- head + hair tuft -->
    <circle class="head" cx="120" cy="58" r="13" />
    <path class="hair" d="M116 45 q5 -8 10 -2" />

    <g id="armfront">
      <path class="limb" d="M120 80 L137 93" />
    </g>
  </g>

  <!-- football -->
  <g id="ball">
    <circle class="skin" cx="160" cy="122" r="10" />
    <path class="mark" d="M160 116 l4.8 3.5 -1.8 5.6 -6 0 -1.8 -5.6 z" />
    <circle class="mark" cx="160" cy="112.5" r="1.6" />
    <circle class="mark" cx="168.5" cy="119" r="1.6" />
    <circle class="mark" cx="165.2" cy="129" r="1.6" />
    <circle class="mark" cx="154.8" cy="129" r="1.6" />
    <circle class="mark" cx="151.5" cy="119" r="1.6" />
  </g>

</svg>
